<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Escola Virtual</h1>
    <h3>Escola Virtual</h3>

    <form action="">
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label>Nome: </label>
                <input type="text">
            <label>Data de Nascimento: </label> 
                <input type="date">
            <label>Nome da Mãe: </label>
                <input type="text">
            <label>Nome do pai: </label>
                <input type="text">
            <label>Telefone: DDD</label>
                (<input type="number">)
            <label>Tel</label>
                <input type="number">
            <label>Ramal: </label>
                <input type="number">
            <label>E-mail: </label>
                <input type="email">
        </fieldset>

        <fieldset>
            <legend>Inforações de matrícula</legend>

            <label>Série: </label>
                <select>
                    <option>pré-escolar</option>
                    <option>superior</option>
                    <option>técnico</option>
                </select>
            <label>Turno: </label>
                <input name="turno" type="radio">Manhã
                <input name="turno" type="radio">Tarde

            <label>Atividades Extracurriculares:</label>
                <input type="checkbox">Informática
                <input type="checkbox">Música
                <input type="checkbox">Balet
                <input type="checkbox">Pintura
                <input type="checkbox">Judô
                <input type="checkbox">Futebol
        </fieldset>

        <button type="submit">Enviar Formulário</button>
        <button type="reset">Limpa Campos</button>
    </form>


</body>
</html>
